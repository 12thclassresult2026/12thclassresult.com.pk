<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007A5E" />
      <stop offset="45%" stop-color="#005B4C" />
      <stop offset="100%" stop-color="#00241C" />
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="25%" stop-color="#FBC02D" />
      <stop offset="70%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- Gold Accent Light -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="100%" stop-color="#FBC02D" />
    </linearGradient>

    <!-- Shield Left Shade -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008269" />
      <stop offset="100%" stop-color="#005B4C" />
    </linearGradient>

    <!-- Shield Right Shade -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00473B" />
      <stop offset="100%" stop-color="#002D25" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.38" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#softShadow)" />

  <!-- Inner Cyan-Emerald Subtle Rim -->
  <rect x="9" y="9" width="110" height="110" rx="23" fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Main Shield Group -->
  <g filter="url(#glow)">
    <!-- Shield Left Half -->
    <path d="M64 43 L32 52 C32 82 48 103 64 112 L64 43 Z" fill="url(#shieldLeft)" />
    
    <!-- Shield Right Half -->
    <path d="M64 43 L96 52 C96 82 80 103 64 112 L64 43 Z" fill="url(#shieldRight)" />
    
    <!-- Shield Gold Outline -->
    <path d="M64 43 L32 52 C32 82 48 103 64 112 C80 103 96 82 96 52 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linejoin="round" />
  </g>

  <!-- Centered "12" in Shield -->
  <g filter="url(#glow)">
    <!-- Digit '1' -->
    <path d="M43 62 L49 57.5 L55 57.5 L55 84 L47.5 84 L47.5 64 L43 66.5 Z" fill="#FFFFFF" />
    <rect x="41" y="83" width="16" height="3.5" rx="1" fill="#FFFFFF" />

    <!-- Digit '2' -->
    <path d="M65 65 C65 59.5 69.5 56.5 76 56.5 C82.5 56.5 87 60 87 65.2 C87 70.2 82.8 74.5 77 78.8 L70.5 83.5 L88 83.5 L88 86.5 L64 86.5 L64 83.5 L74.8 75.2 C79 72 81.2 69.2 81.2 65.2 C81.2 62.2 79 59.8 76 59.8 C72.8 59.8 70.5 62 70.2 65 Z" fill="#FFFFFF" />
  </g>

  <!-- Golden Star under 12 in shield -->
  <polygon points="64,96 65.8,100.5 70.5,100.5 66.8,103.2 68.2,107.5 64,104.8 59.8,107.5 61.2,103.2 57.5,100.5 62.2,100.5" fill="url(#goldGrad)" />

  <!-- Academic Graduation Cap (Mortarboard) -->
  <g filter="url(#softShadow)">
    <!-- Cap Neck / Skull Base -->
    <path d="M48 35 C48 35 49 44 64 44 C79 44 80 35 80 35 L78 31 L50 31 Z" fill="url(#goldGrad)" />
    <path d="M51 36 C55 41 73 41 77 36" fill="none" stroke="#D78A00" stroke-width="1.5" />

    <!-- Cap Diamond Top -->
    <polygon points="64,13 103,26.5 64,39 25,26.5" fill="url(#goldLight)" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <!-- Diamond Highlight Accent -->
    <polygon points="64,15 98,26.5 64,37 64,15" fill="#FFFDE7" fill-opacity="0.4" />

    <!-- Center Button -->
    <ellipse cx="64" cy="26.5" rx="3.5" ry="2.2" fill="#E65100" />
    <ellipse cx="64" cy="26" rx="2.5" ry="1.5" fill="#FFF176" />

    <!-- Hanging Tassel -->
    <path d="M64 26.5 Q38 30 37 45" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <!-- Tassel Ring & Fringe -->
    <circle cx="37" cy="46" r="2" fill="#E65100" />
    <polygon points="35,47 39,47 41,56 33,56" fill="url(#goldLight)" />
  </g>
</svg>