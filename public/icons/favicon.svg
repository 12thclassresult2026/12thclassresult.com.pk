<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006956" />
      <stop offset="50%" stop-color="#005B4C" />
      <stop offset="100%" stop-color="#002D25" />
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="35%" stop-color="#FBC02D" />
      <stop offset="70%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- Gold Accent Light -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="100%" stop-color="#FBC02D" />
    </linearGradient>

    <!-- Shield Left Shade -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007B65" />
      <stop offset="100%" stop-color="#005B4C" />
    </linearGradient>

    <!-- Shield Right Shade -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004D40" />
      <stop offset="100%" stop-color="#00332B" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#softShadow)" />

  <!-- Inner Subtle Border -->
  <rect x="9" y="9" width="110" height="110" rx="23" fill="none" stroke="#2DD4BF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Main Shield Group with Shadow -->
  <g filter="url(#glow)">
    <!-- Shield Left Half -->
    <path d="M64 45 L32 54 C32 82 48 103 64 112 L64 45 Z" fill="url(#shieldLeft)" />
    
    <!-- Shield Right Half -->
    <path d="M64 45 L96 54 C96 82 80 103 64 112 L64 45 Z" fill="url(#shieldRight)" />
    
    <!-- Shield Gold Outline -->
    <path d="M64 45 L32 54 C32 82 48 103 64 112 C80 103 96 82 96 54 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linejoin="round" />
  </g>

  <!-- Number 11 in Shield -->
  <!-- Left '1' -->
  <path d="M47 70 L52 66 L55 66 L55 95 L49 95 L49 73 L47 74 Z" fill="#FFFFFF" filter="url(#glow)" />
  <rect x="46" y="94" width="12" height="3" rx="1" fill="#FFFFFF" />

  <!-- Right '1' -->
  <!-- We create symmetrical, crisp paths for 11 -->
  <path d="M68 70 L73 66 L76 66 L76 95 L70 95 L70 73 L68 74 Z" fill="#FFFFFF" filter="url(#glow)" />
  <rect x="67" y="94" width="12" height="3" rx="1" fill="#FFFFFF" />

  <!-- Academic Graduation Cap (Mortarboard) -->
  <g filter="url(#softShadow)">
    <!-- Cap Neck / Skull Base -->
    <path d="M48 37 C48 37 49 46 64 46 C79 46 80 37 80 37 L78 33 L50 33 Z" fill="url(#goldGrad)" />
    <path d="M51 38 C55 43 73 43 77 38" fill="none" stroke="#D78A00" stroke-width="1.5" />

    <!-- Cap Diamond Top -->
    <polygon points="64,16 102,29 64,41 26,29" fill="url(#goldLight)" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <!-- Diamond Highlight Accent -->
    <polygon points="64,18 97,29 64,39 64,18" fill="#FFF9C4" fill-opacity="0.35" />

    <!-- Center Button -->
    <ellipse cx="64" cy="28.5" rx="3.5" ry="2.2" fill="#E65100" />
    <ellipse cx="64" cy="28" rx="2.5" ry="1.5" fill="#FFF176" />

    <!-- Hanging Tassel -->
    <path d="M64 28.5 Q38 32 37 47" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <!-- Tassel Ring & Fringe -->
    <circle cx="37" cy="48" r="2" fill="#E65100" />
    <polygon points="35,49 39,49 41,58 33,58" fill="url(#goldLight)" />
  </g>

  <!-- Little Golden Star under 11 in shield -->
  <polygon points="64,99 65.5,103 70,103 66.5,105.5 68,109.5 64,107 60,109.5 61.5,105.5 58,103 62.5,103" fill="url(#goldGrad)" />
</svg>
